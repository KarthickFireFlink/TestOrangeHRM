name: Trigger Automation Repo

on:
  push:
    branches:
      - TestWeb

jobs:
  trigger-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Test Repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KarthickFireFlink/FF_OrangeHRM_TestSuite/dispatches \
            -d '{"event_type":"source-code-updated"}'
